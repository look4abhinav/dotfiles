# === HYPRLAND LIQUID GLASS CONFIG ===
# Hardware: Intel Iris Xe

monitor = , preferred, auto, 1

# Wayland & GTK Environment Variables
env = XCURSOR_SIZE,26
env = HYPRCURSOR_SIZE,26
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_SCALE,1
env = GTK_THEME,Adwaita:dark
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent.socket

# Core variables
$mainMod = SUPER
$terminal = ghostty
$browser = zen-browser
$menu = fuzzel
$wallpaper = waypaper
$file_explorer = thunar
$code = code

# Autostart
exec-once = waybar
exec-once = mako
exec-once = waypaper --restore
exec-once = hypridle -c ~/.config/hypr/hypridle.conf
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hyprctl setcursor Bibata-Modern-Ice 26
exec-once = kanshi

# Input
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# --- AESTHETICS OVERHAUL ---

general {
    gaps_in = 1
    gaps_out = 0
    border_size = 2

    # Animated gradient border
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    rounding = 12

    # Transparency
    active_opacity = 0.90
    inactive_opacity = 0.80
    fullscreen_opacity = 1.0

    # Glow Effect
    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(33ccff55)
        color_inactive = rgba(00000033)
    }

    # Glassmorphism Blur
    blur {
        enabled = true
        size = 5
        passes = 2
        ignore_opacity = true
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    # Smooth, fast, zero-bounce curves
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = liner, 1, 1, 1, 1

    # Apply the fluid curves to window actions (Speed set to 4 for smoothness)
    animation = windows, 1, 4, easeOutQuint, slide
    animation = windowsIn, 1, 4, easeOutQuint, slide
    animation = windowsOut, 1, 4, easeOutQuint, slide
    animation = windowsMove, 1, 4, easeInOutCubic, slide

    # Border animations (kept exactly as you had them)
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop

    # Fading and workspace swipes
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, easeOutQuint, slide
}

# Apply the glassmorphism blur to Mako
layerrule = match:namespace mako, blur on, ignore_alpha 0.1
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace waybar

# --- END AESTHETICS ---

dwindle {
    preserve_split = true
}

binds {
    allow_workspace_cycles = true
}

gestures {
    workspace_swipe_invert = true
    workspace_swipe_distance = 300
    workspace_swipe_min_speed_to_force = 5
}

misc {
    focus_on_activate = true
}

layerrule {
    name = fuzzel_glass
    match:namespace = fuzzel
    blur = on
    ignore_alpha = 0.1
}

# Keybindings
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $file_explorer
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod SHIFT, L, exec, hyprlock -c ~/.config/hypr/hyprlock.conf
bind = $mainMod, B, exec, $browser
bind = $mainMod, P, exec, $browser --private-window
bind = $mainMod, Space, exec, $menu
bind = $mainMod, W, exec, $wallpaper
bind = $mainMod, F, fullscreen,
bind = $mainMod, S, exec, signal-desktop
bind = $mainMod, C, exec, $code

# Movement
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Movement (Arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Mouse bindings for window management
bindm = $mainMod, mouse:272, movewindow   # Super + Left Click + Drag to Move
bindm = $mainMod, mouse:273, resizewindow # Super + Right Click + Drag to Resize

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Volume and Brightness

# Path to your script
$sysScript = ~/.config/hypr/scripts/sys_info.sh

# Volume
binde = , XF86AudioRaiseVolume, exec, $sysScript vol_up
binde = , XF86AudioLowerVolume, exec, $sysScript vol_down
bind  = , XF86AudioMute, exec, $sysScript vol_mute

# Screen Brightness
binde = , XF86MonBrightnessUp, exec, $sysScript bright_up
binde = , XF86MonBrightnessDown, exec, $sysScript bright_down

# Caps Lock
bindr = CAPS, Caps_Lock, exec, $sysScript caps

# Screenshot
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh

# Clipboard History
bind = $mainMod , V, exec, cliphist list | fuzzel -d -w 80 | cliphist decode | wl-copy

# Swipe left/right with 3 fingers to switch workspaces
gesture = 3, horizontal, workspace

# Toggle to the previously focused workspace
bind = SUPER, Tab, workspace, previous

# Voice to Text (Push-to-Talk)
# Trigger on press
bind = SUPER, R, exec, ~/Codebase/Whisper/hyprvoice.sh start
# Trigger on release ('r' flag)
bindr = SUPER, R, exec, ~/Codebase/Whisper/hyprvoice.sh stop

# HyprMod managed settings
source = ./hyprland-gui.conf
