# === HYPRLAND LIQUID GLASS CONFIG ===
# Hardware: Intel Iris Xe

monitor=,preferred,auto,auto

# Wayland & GTK Environment Variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_SCALE,1
env = GTK_THEME,Adwaita:dark
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent.socket

# Core variables
$terminal = ghostty
$menu = fuzzel
$wallpaper = waypaper
$browser = zen-browser
$mainMod = SUPER

# Autostart
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = waypaper --restore
exec-once = hypridle -c ~/.config/hypr/hypridle.conf
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &

# Input
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# --- AESTHETICS OVERHAUL ---

general {
    gaps_in = 1 
    gaps_out = 5
    border_size = 2
    
    # Animated gradient border 
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    
    layout = dwindle
}

decoration {
    rounding = 12
    
    # Transparency
    active_opacity = 0.85
    inactive_opacity = 0.70
    fullscreen_opacity = 1.0

    # The "Glow" Effect
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(33ccff66)
        color_inactive = rgba(00000044)
    }

    # Glassmorphism Blur
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    # Bouncy, fluid bezier curves
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.05
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    # Apply the fluid curves to window actions
    animation = windows, 1, 3, wind, slide
    animation = windowsIn, 1, 3, winIn, slide
    animation = windowsOut, 1, 4, winOut, slide
    animation = windowsMove, 1, 4, wind, slide
    
    # This slowly rotates the gradient on your active border
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

# --- END AESTHETICS ---

dwindle {
    pseudotile = true
    preserve_split = true
}

binds {
    allow_workspace_cycles = true
}

gestures {
    workspace_swipe_invert = true
    workspace_swipe_distance = 300
    workspace_swipe_min_speed_to_force = 5
}

misc {
    focus_on_activate = true
}

# Keybindings
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, ghostty -e yazi
bind = $mainMod, Q, killactive, 
bind = $mainMod SHIFT, E, exit, 
bind = $mainMod SHIFT, L, exec, hyprlock -c ~/.config/hypr/hyprlock.conf
bind = $mainMod, B, exec, $browser
bind = $mainMod, Space, exec, $menu
bind = $mainMod, W, exec, $wallpaper
bind = $mainMod, V, togglefloating, 
bind = $mainMod, F, fullscreen,
bind = $mainMod, S, exec, signal-desktop
bind = $mainMod, O, exec, ghostty -e opencode
bind = $mainMod, C, exec, zed

# Movement
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Movement (Arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Mouse bindings for window management
bindm = $mainMod, mouse:272, movewindow   # Super + Left Click + Drag to Move
bindm = $mainMod, mouse:273, resizewindow # Super + Right Click + Drag to Resize

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Volume and Brightness

# binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
# binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
# binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Path to your script
$sysScript = ~/.config/hypr/scripts/sys_info.sh

# Volume
binde = , XF86AudioRaiseVolume, exec, $sysScript vol_up
binde = , XF86AudioLowerVolume, exec, $sysScript vol_down
bind  = , XF86AudioMute, exec, $sysScript vol_mute

# Screen Brightness
binde = , XF86MonBrightnessUp, exec, $sysScript bright_up
binde = , XF86MonBrightnessDown, exec, $sysScript bright_down

# Keyboard Brightness
binde = , XF86KbdBrightnessUp, exec, $sysScript kbd_up
binde = , XF86KbdBrightnessDown, exec, $sysScript kbd_down

# Caps Lock
bindr = CAPS, Caps_Lock, exec, $sysScript caps

# Screenshot
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Swipe left/right with 3 fingers to switch workspaces
gesture = 3, horizontal, workspace

# Toggle to the previously focused workspace
bind = SUPER, Tab, workspace, previous

# Application Specific

# Apply the glassmorphism blur to Mako 
layerrule = match:namespace mako, blur on, ignore_alpha 0.1

