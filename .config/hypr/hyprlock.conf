# === HYPRLOCK LIQUID GLASS CONFIG ===

background {
    monitor =
    path = screenshot
    
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# === CENTER: AUTHENTICATION & TIME ===

input-field {
    monitor =
    size = 400, 70
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = rgba(33ccffee)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgba(255, 255, 255, 1.0)
    
    fade_on_empty = false
    font_family = JetBrains Mono
    placeholder_text = <i><span foreground="##ffffff99">Enter Password</span></i>
    hide_input = false
    
    position = 0, -110
    halign = center
    valign = center
    
    shadow_passes = 4
    shadow_size = 20
    shadow_color = rgba(33ccff33)
}

# The Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 100
    font_family = JetBrains Mono Extrabold
    
    position = 0, 160
    halign = center
    valign = center
    
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.8)
}

# The Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %-d")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 30
    font_family = JetBrains Mono Extrabold
    
    position = 0, 60
    halign = center
    valign = center
    
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
}

# The User Greeting
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.8)
    font_size = 20
    font_family = JetBrains Mono Bold
    
    position = 0, -20
    halign = center
    valign = center
    
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
}

# === TOP RIGHT: WEATHER PANEL ===

shape {
    monitor =
    size = 340, 150 
    color = rgba(0, 0, 0, 0.4)
    rounding = 30
    border_size = 2
    border_color = rgba(33ccffee)
    
    position = -40, -40
    halign = right
    valign = top
    
    shadow_passes = 4
    shadow_size = 20
    shadow_color = rgba(33ccff33)
}

label {
    monitor =
    text = cmd[update:1800000] bash -c 'res=$(curl -s "wttr.in/?format=%c|%C|%t|%h|%w"); IFS="|" read -r icon cond temp hum wind <<< "$res"; echo -e "$icon$cond\n<span foreground=\"##33ccff\"> </span> $temp   <span foreground=\"##33ccff\"> </span> $hum\n<span foreground=\"##33ccff\"> </span> $wind"'
    color = rgba(255, 255, 255, 0.9)
    font_size = 18
    font_family = JetBrains Mono Bold
    
    position = -75, -60
    halign = right
    valign = top
    
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
}

# === TOP LEFT: SYSTEM INFO CARD ===

shape {
    monitor =
    size = 340, 150
    color = rgba(0, 0, 0, 0.4)
    rounding = 30
    border_size = 2
    border_color = rgba(33ccffee)
    
    position = 40, -40
    halign = left
    valign = top
    
    shadow_passes = 4
    shadow_size = 20
    shadow_color = rgba(33ccff33)
}

label {
    monitor =
    text = cmd[update:5000] echo -e "<span foreground=\"##33ccff\"> </span> CPU: $(top -bn1 | grep 'Cpu(s)' | awk '{print $2}')%\n<span foreground=\"##33ccff\"> </span> RAM: $(free -h | awk '/^Mem:/ {print $3}')\n<span foreground=\"##33ccff\"> </span> BAT: $(cat /sys/class/power_supply/BAT*/capacity | head -1)%"
    color = rgba(255, 255, 255, 0.9)
    font_size = 18
    font_family = JetBrains Mono Bold
    
    position = 75, -70
    halign = left
    valign = top
    
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
}

# === BOTTOM LEFT: NETWORK & BLUETOOTH CARD ===

shape {
    monitor =
    size = 340, 110
    color = rgba(0, 0, 0, 0.4)
    rounding = 30
    border_size = 2
    border_color = rgba(33ccffee)
    
    position = 40, 40
    halign = left
    valign = bottom
    
    shadow_passes = 4
    shadow_size = 20
    shadow_color = rgba(33ccff33)
}

label {
    monitor =
    text = cmd[update:5000] bash -c 'c="##33ccff"; wifi=$(nmcli -t -f active,ssid dev wifi | grep "^yes" | cut -d: -f2); [ -z "$wifi" ] && wifi="Off"; bt=$(bluetoothctl devices Connected | head -n 1 | cut -d " " -f 3-); [ -z "$bt" ] && bt=$(bluetoothctl show | grep -q "Powered: yes" && echo "On" || echo "Off"); echo -e "<span foreground=\"$c\"> </span> WIFI: ${wifi}\n<span foreground=\"$c\"> </span> BT:   ${bt}"'
    color = rgba(255, 255, 255, 0.9)
    font_size = 18
    font_family = JetBrains Mono Bold
    
    position = 75, 68
    halign = left
    valign = bottom
    
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
}
