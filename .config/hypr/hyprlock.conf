# === HYPRLOCK LIQUID GLASS CONFIG ===

background {
    monitor =
    # Captures your current screen and applies the glass blur
    path = screenshot
    
    # Glassmorphism settings (matches your hyprland.conf)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    # Glow effect: Cyan border with a semi-transparent dark glass interior
    outer_color = rgba(33ccffee)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgba(255, 255, 255, 1.0)
    
    fade_on_empty = false
    font_family = JetBrains Mono
    placeholder_text = <i><span foreground="##ffffff99">Unlock...</span></i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
    
    # Drop shadow to create the glowing emission
    shadow_passes = 2
    shadow_size = 15
    shadow_color = rgba(33ccff66)
}

# The Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = JetBrains Mono Extrabold
    position = 0, 100
    halign = center
    valign = center
    
    # Subtle shadow to lift the text off the blurred background
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.8)
}

# The User Greeting
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 10
    halign = center
    valign = center
    
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.8)
}
