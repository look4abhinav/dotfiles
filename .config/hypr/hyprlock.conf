# === HYPRLOCK MODERN MINIMALIST CONFIG ===

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# === CENTER: AUTHENTICATION & TIME ===

input-field {
    monitor =
    size = 400, 70
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    # Sleek glassmorphism pill
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(255, 255, 255, 0.05)
    font_color = rgba(255, 255, 255, 1.0)

    fade_on_empty = false
    font_family = Inter
    placeholder_text = <i><span foreground="##ffffff99">Password...</span></i>
    hide_input = false

    position = 0, -130
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 15
    shadow_color = rgba(0, 0, 0, 0.4)
}

# The Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 110 # Slightly larger clock
    font_family = Inter Display Bold

    position = 0, 180
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.6)
}

# The Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %-d")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 32 # Scaled back up for readability
    font_family = Inter Medium

    position = 0, 70
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)
}

# The User Greeting
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.75)
    font_size = 22 # Larger greeting
    font_family = Inter

    position = 0, -30
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# === TOP RIGHT: WEATHER PANEL ===

label {
    monitor =
    text = cmd[update:1800000] bash -c 'res=$(curl -s "wttr.in/?format=%c|%C|%t|%h|%w"); IFS="|" read -r icon cond temp hum wind <<< "$res"; echo -e "$icon $cond\n<span foreground=\"##ffffff99\"> </span> $temp   <span foreground=\"##ffffff99\"> </span> $hum\n<span foreground=\"##ffffff99\"> </span> $wind"'
    color = rgba(255, 255, 255, 0.9)
    font_size = 18 # Restored to your original readable size
    font_family = JetBrains Mono

    position = -50, -50
    halign = right
    valign = top

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.7)
}

# === TOP LEFT: SYSTEM INFO CARD ===

label {
    monitor =
    text = cmd[update:5000] echo -e "<span foreground=\"##ffffff99\"> </span> CPU: $(top -bn1 | grep 'Cpu(s)' | awk '{print $2}')%\n<span foreground=\"##ffffff99\"> </span> RAM: $(free -h | awk '/^Mem:/ {print $3}')\n<span foreground=\"##ffffff99\"> </span> BAT: $(cat /sys/class/power_supply/BAT*/capacity | head -1)%"
    color = rgba(255, 255, 255, 0.9)
    font_size = 18 # Restored to your original readable size
    font_family = JetBrains Mono

    position = 50, -50
    halign = left
    valign = top

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.7)
}

# === BOTTOM LEFT: NETWORK & BLUETOOTH CARD ===

label {
    monitor =
    text = cmd[update:5000] bash -c 'c="##ffffff99"; wifi=$(nmcli -t -f active,ssid dev wifi | grep "^yes" | cut -d: -f2); [ -z "$wifi" ] && wifi="Off"; bt=$(bluetoothctl devices Connected | head -n 1 | cut -d " " -f 3-); [ -z "$bt" ] && bt=$(bluetoothctl show | grep -q "Powered: yes" && echo "On" || echo "Off"); echo -e "<span foreground=\"$c\"> </span> WIFI: ${wifi}\n<span foreground=\"$c\"> </span> BT:   ${bt}"'
    color = rgba(255, 255, 255, 0.9)
    font_size = 18 # Restored to your original readable size
    font_family = JetBrains Mono

    position = 50, 50
    halign = left
    valign = bottom

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.7)
}
