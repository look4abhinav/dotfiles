[main]
font=JetBrains Mono:size=12
prompt="> "
terminal=ghostty -e
lines=10
width=45
inner-pad=10
horizontal-pad=30
vertical-pad=20
line-height=30

[colors]
# Black, 40% opaque
background=00000066
# White text
text=ffffffff
# Cyan match
match=33ccffff
# Cyan background for selection, mostly transparent
selection=33ccff44
# White text on selection
selection-text=ffffffff
# Cyan match on selection
selection-match=33ccffff
# Cyan border
border=33ccffee

[border]
width=2
# Heavy rounding
radius=20
